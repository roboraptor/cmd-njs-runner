; ===================================================================
; ProjectRunner Configuration File (Optional configuration file)
; ===================================================================
; This file is entirely optional. If it doesn't exist or a value
; is left empty, ProjectRunner.bat will automatically detect the settings
; from package.json or use sensible defaults.
; ===================================================================

[Project]
; Project title displayed in the header (if empty, loads from package.json or folder name)
Title=

; Subtitle or a short project description
Subtitle=

[Server]
; URL for the development server (default: http://localhost:5173 for Vite, otherwise http://localhost:3000)
DevUrl=

; URL for the production server (default: http://localhost:5173 for Vite, otherwise http://localhost:3000)
ProdUrl=

; Automatically open the web browser when starting dev/prod server? (true / false)
OpenBrowser=true

[Build]
; The folder where the production build is generated (e.g., dist, .next, build, out)
; If not specified, ProjectRunner detects dist for Vite or .next for Next.js
BuildDir=

[Commands]
; Custom commands for individual actions (if different from the defaults)
DevCommand=npm run dev
BuildCommand=npm run build
ProdCommand=npm run start
InstallCommand=npm install
