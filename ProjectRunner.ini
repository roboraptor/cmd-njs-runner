; ===================================================================
; ProjectRunner Configuration File (Volitelný konfigurační soubor)
; ===================================================================
; Tento soubor je zcela volitelný. Pokud neexistuje nebo je některá
; hodnota nevyplněná, ProjectRunner.bat automaticky detekuje nastavení
; z package.json nebo použije rozumné výchozí hodnoty.
; ===================================================================

[Project]
; Název projektu zobrazovaný v záhlaví (pokud je prázdné, načte se z package.json nebo názvu složky)
Title=

; Podtitul nebo krátký popis projektu
Subtitle=

[Server]
; URL pro vývojový server (výchozí: http://localhost:5173 pro Vite, jinak http://localhost:3000)
DevUrl=

; URL pro produkční server (výchozí: http://localhost:5173 pro Vite, jinak http://localhost:3000)
ProdUrl=

; Automaticky otevřít webový prohlížeč při spuštění dev/prod serveru? (true / false)
OpenBrowser=true

[Build]
; Složka, do které se generuje produkční build (např. dist, .next, build, out)
; Pokud není zadáno, ProjectRunner detekuje dist pro Vite nebo .next pro Next.js
BuildDir=

[Commands]
; Vlastní příkazy pro jednotlivé akce (pokud se liší od standardních)
DevCommand=npm run dev
BuildCommand=npm run build
ProdCommand=npm run start
InstallCommand=npm install
